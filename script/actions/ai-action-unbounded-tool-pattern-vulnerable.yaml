name: Vulnerable AI Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          allowed_non_write_users: ${{ github.event.issue.user.login }}
          # Unbounded: the grant stops at the command, so the agent may act on
          # any issue rather than the one that triggered the run.
          claude_args: --allowedTools "Read,Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue view:*)"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
